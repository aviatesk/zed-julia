id = "JETLS"
name = "Julia - JETLS"
description = "Julia support with JETLS."
version = "0.1.10"
schema_version = 1
authors = [
    "Shuhei Kadowaki <aviatesk@gmail.com>",
    "Paul Berg <paul@plutojl.org>",
]
repository = "https://github.com/aviatesk/zed-julia"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]

[grammars.julia]
repository = "https://github.com/tree-sitter/tree-sitter-julia"
commit = "e0f9dcd180fdcfcfa8d79a3531e11d99e79321d3"

[language_servers.JETLS]
languages = ["Julia"]
name = "JETLS.jl"
